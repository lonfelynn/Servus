<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Messenger</title>

  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="bg-orbs">
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>
  <div class="orb orb3"></div>
  <div class="orb orb4"></div>
</div>

<div class="page">
  <div class="panel">

    <div class="logo">
      <div class="logo-icon">💬</div>
      <div class="logo-text">Messenger</div>
    </div>

    <h1>Willkommen zurück 👋</h1>

    <p class="subtitle">
      Noch kein Konto?
      <a href="/register">Registrieren</a>
    </p>

    <!-- Fehlermeldung (versteckt bis ein Fehler kommt) -->
    <div id="error-msg" class="error-msg hidden"></div>

    <form id="login-form">
      <label>Benutzername</label>
      <input type="text"
             id="username"
             placeholder="dein_name"
             required>

      <label>Passwort</label>
      <input type="password"
             id="password"
             placeholder="••••••••"
             required>

      <button type="submit" id="submit-btn">
        Anmelden
      </button>
    </form>

  </div>
</div>

<script>
  const form      = document.getElementById("login-form");
  const errorMsg  = document.getElementById("error-msg");
  const submitBtn = document.getElementById("submit-btn");

  form.addEventListener("submit", async function(event) {
    // Verhindert das normale Absenden des Formulars (kein Neuladen)
    event.preventDefault();

    // Button deaktivieren damit man nicht doppelt klickt
    submitBtn.disabled = true;
    submitBtn.textContent = "Wird geladen...";
    errorMsg.classList.add("hidden");

    const username = document.getElementById("username").value;
    const password = document.getElementById("password").value;

    // Daten als JSON ans Backend schicken
    const response = await fetch("/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username, password })
    });

    const data = await response.json();

    if (data.ok) {
      // Erfolg → zur Zielseite weiterleiten
      window.location.href = data.redirect;
    } else {
      // Fehler → Meldung anzeigen
      errorMsg.textContent = data.error;
      errorMsg.classList.remove("hidden");
      submitBtn.disabled = false;
      submitBtn.textContent = "Anmelden";
    }
  });
</script>

</body>
</html>
