<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Servus</title>

  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<div class="bg-orbs">
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>
  <div class="orb orb3"></div>
  <div class="orb orb4"></div>
</div>

<div class="page">
  <div class="panel">

    <div class="logo">
      <img src="{{ url_for('static', filename='img/logo.png') }}" alt="Servus" />
      <div class="logo-text">Servus</div>
    </div>

    <h1>Willkommen zurück 👋</h1>

    <p class="subtitle">
      Noch kein Konto?
      <a href="/register">Registrieren</a>
    </p>

    <!-- Fehlermeldung (versteckt bis ein Fehler kommt) -->
    <div id="error-msg" class="error-msg hidden"></div>

    <form id="login-form">
      <label>Benutzername</label>
      <input type="text"
             id="username"
             placeholder="dein_name"
             required>

      <label>Passwort</label>
      <input type="password"
             id="password"
             placeholder="••••••••"
             required>

      <button type="submit" id="submit-btn">
        Anmelden
      </button>
    </form>

  </div>
</div>

<!-- Footer mit GitHub-Link -->
<footer style="position: fixed; bottom: 20px; right: 20px; z-index: 10;">
  <a href="https://github.com/lonfelynn/Servus" target="_blank" rel="noopener noreferrer" 
     title="Servus auf GitHub" style="display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: 50%; background: var(--accent); color: white; text-decoration: none; transition: transform 0.2s;" 
     onmouseover="this.style.transform='scale(1.1)'" onmouseout="this.style.transform='scale(1)'">
    <svg class="icon" viewBox="0 0 24 24" fill="currentColor" width="20" height="20" aria-hidden="true">
      <path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v 3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/>
    </svg>
  </a>
</footer>

<script src="{{ url_for('static', filename='js/crypto.js') }}"></script>
<script src="{{ url_for('static', filename='js/login.js') }}"></script>

</body>
</html>
