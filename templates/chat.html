<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Servus Messenger</title>

  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/chat.css') }}">
</head>

<body>
<div class="app">

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-top">
      <div class="logo-icon">💬</div>
      <div class="logo-text">Servus</div>
    </div>

    <div class="me-bar">
      <div class="avatar" id="me-avatar"></div>
      <div class="me-info">
        <div class="me-name" id="me-name"></div>
        <div class="me-level" id="me-level">Level 1</div>
      </div>
      <button class="icon-btn" id="logout-btn" title="Abmelden">⎋</button>
    </div>

    <div class="list-header">
      <div class="list-title">Chats</div>
      <button class="icon-btn" id="new-group-btn" title="Neue Gruppe">＋</button>
    </div>
    <div class="chat-list" id="chat-list">
      <div class="empty-list">Lade Chats…</div>
    </div>

    <div class="list-header" id="requests-header">
      <div class="list-title">Anfragen</div>
      <div class="notif-badge hidden" id="requests-badge"></div>
    </div>
    <div class="requests-list" id="requests-list"></div>

    <div class="list-title">Nutzer suchen</div>
    <div class="search-box">
      <input type="text" id="search-input" class="search-input"
             placeholder="Nutzername suchen…" maxlength="80" autocomplete="off"/>
    </div>
    <div class="search-results" id="search-results"></div>
  </aside>

   <!-- Chat -->
  <main class="chat-panel" id="chat-main">
    <div id="chat-placeholder" class="placeholder">
      <div class="big">💬</div>
      <p>Wähle links einen Kontakt aus, um zu chatten.</p>
    </div>

    <div id="chat-view" class="chat-inner hidden" style="min-width:0;">
      <div class="chat-header">
        <button class="back-btn" id="back-btn" title="Zurück">←</button>
        <div class="avatar" id="peer-avatar"></div>
        <div class="chat-header-info">
          <div class="chat-header-name" id="peer-name"></div>
          <div class="chat-header-sub" id="peer-sub"></div>
        </div>
        <button class="icon-btn" id="chat-settings-btn" title="Chat verwalten">⚙</button>
      </div>

      <div class="messages" id="messages"></div>

      <div class="input-area">
        <div class="input-row">
          <textarea class="input-field" id="msg-input" rows="1"
                    placeholder="Nachricht schreiben…" maxlength="2000"></textarea>
          <button class="send-btn" id="send-btn" title="Senden">➤</button>
        </div>
      </div>
    </div>
  </main>

</div>

<!-- Modal: Neue Gruppe erstellen -->
<div class="modal-overlay hidden" id="group-modal">
  <div class="modal">
    <div class="modal-title">Neue Gruppe</div>
    <input class="modal-input" id="group-name-input" type="text"
           placeholder="Gruppenname (optional)" maxlength="80"/>
    <div class="modal-label">Mitglieder auswählen</div>
    <div class="member-picker" id="group-member-picker"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="group-cancel-btn">Abbrechen</button>
      <button class="btn btn-primary" id="group-create-btn">Erstellen</button>
    </div>
  </div>
</div>

<!-- Modal: Chat verwalten (umbenennen / Mitglieder) -->
<div class="modal-overlay hidden" id="manage-modal">
  <div class="modal">
    <div class="modal-title">Chat verwalten</div>
    <div class="modal-label">Name</div>
    <div class="modal-row">
      <input class="modal-input" id="rename-input" type="text"
             placeholder="Chatname" maxlength="80"/>
      <button class="btn btn-primary" id="rename-btn">Speichern</button>
    </div>
    <div class="modal-label">Mitglieder</div>
    <div class="member-list" id="manage-member-list"></div>
    <div class="modal-label">Hinzufügen</div>
    <div class="member-picker" id="manage-add-picker"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="manage-close-btn">Schließen</button>
    </div>
  </div>
</div>

<!-- Modal: Freundschaftsanfrage senden -->
<div class="modal-overlay hidden" id="request-modal">
  <div class="modal">
    <div class="modal-title">Freundschaftsanfrage</div>
    <div class="modal-label" id="request-modal-sub"></div>
    <textarea id="request-message" class="modal-input" rows="4" maxlength="2048"
              placeholder="Nachricht (optional, max. 2048 Zeichen)…"></textarea>
    <div class="modal-hint" id="request-charcount">0 / 2048</div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="request-cancel-btn">Abbrechen</button>
      <button class="btn btn-primary" id="request-send-btn">Anfrage senden</button>
    </div>
  </div>
</div>

<!-- Server-Werte für das Script bereitstellen -->
<script>
  window.SERVUS = { me: {{ user_id }}, myName: {{ username | tojson }} };
</script>
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script src="{{ url_for('static', filename='js/chat.js') }}"></script>

<!-- Mobile Navigation: Sidebar ↔ Chat wechseln -->
<script>
  const isMobile = () => window.innerWidth <= 600;
  const sidebarEl = document.getElementById('sidebar');
  const chatMainEl = document.getElementById('chat-main');

  // Von chat.js aufgerufen, sobald ein Chat geöffnet wird.
  window.showChatMobile = function () {
    if (!isMobile()) return;
    sidebarEl.classList.add('slide-out');
    chatMainEl.classList.add('slide-in');
  };

  document.getElementById('back-btn').addEventListener('click', () => {
    sidebarEl.classList.remove('slide-out');
    chatMainEl.classList.remove('slide-in');
  });

  window.addEventListener('resize', () => {
    if (!isMobile()) {
      sidebarEl.classList.remove('slide-out');
      chatMainEl.classList.remove('slide-in');
    }
  });
</script>

</body>
</html>
