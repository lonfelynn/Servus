<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Registrieren – Messenger</title>

  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<div class="bg-orbs">
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>
  <div class="orb orb3"></div>
  <div class="orb orb4"></div>
</div>

<div class="page">
  <div class="panel">

    <div class="logo">
      <div class="logo-icon">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h16a1 1 0 011 1v11a1 1 0 01-1 1H9l-5 4V5a1 1 0 011-1z"/></svg>
      </div>
      <div class="logo-text">Messenger</div>
    </div>

    <h1>Konto erstellen 🚀</h1>

    <p class="subtitle">
      Schon registriert?
      <a href="/login">Anmelden</a>
    </p>

    <!-- Fehlermeldung (versteckt bis ein Fehler kommt) -->
    <div id="error-msg" class="error-msg hidden"></div>

    <form id="register-form">
      <label>Benutzername</label>
      <input type="text"
             id="username"
             placeholder="dein_name"
             required>

      <label>Passwort</label>
      <input type="password"
             id="password"
             placeholder="••••••••"
             required>

      <label>Passwort bestätigen</label>
      <input type="password"
             id="confirm_password"
             placeholder="••••••••"
             required>

      <button type="submit" id="submit-btn">
        Konto erstellen
      </button>
    </form>

  </div>
</div>

<script src="{{ url_for('static', filename='js/register.js') }}"></script>

</body>
</html>
